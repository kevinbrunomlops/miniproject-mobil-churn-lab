apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: churn-api
  namespace: kevin-bruno
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-staging

spec:
  ingressClassName: traefik

  tls:
    - hosts:
        - kevin-bruno.89-167-53-206.sslip.io
      secretName: churn-api-tls

  rules:
    - host: kevin-bruno.89-167-53-206.sslip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: churn-api
                port:
                  number: 80